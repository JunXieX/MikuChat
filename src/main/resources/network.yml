# 跨服网络配置（基于 Velocity 代理端插件转发，不需要 Redis）
#
# 工作方式：后端通过插件消息通道把消息交给代理端插件，由代理端完成
#   - 跨服消息转发（只发给目标服务器，不再扇出给所有服务器）
#   - 跨服在线查询（代理端直接查表应答，零额外往返）
#   - 共享状态（禁言）保管与落盘
# 代理端插件为 MikuChat-Velocity，需与后端版本同时部署。
#
# ⚠ 后端必须运行在该 Velocity 代理下，且 config.yml 的 server-id 必须与
#   velocity.toml 中 [servers] 的服务器名完全一致，否则跨服转发与在线查询会错乱。

enabled: true

# 插件消息通道，代理端插件使用同一通道名
channel: "mikuchat:proxy"

# 等待代理端应答在线查询的超时（毫秒）。代理端直接查表，正常应为毫秒级。
presence-timeout-millis: 1500

# 本服无玩家在线时，暂存待发消息的最大条数（玩家接入后按序补发）。
# 插件消息必须借由玩家连接发送，因此无人在线时只能暂存。
# 需大于「启动时要从本地回填到共享存储的禁言条数」，否则超出部分会被丢弃。
outbound-queue-capacity: 1024

# 可信来源服务器白名单：填写 velocity.toml 中 [servers] 的全部服务器名。
# 留空（默认）表示不校验来源，兼容旧配置；一旦填写，将只接受名单内服务器发来的
# 跨服消息。建议在正式环境填写，防止后端脱离代理运行时被伪造的插件消息注入。
trusted-servers: []
