# 聊天管线配置

# 单条消息长度上限（字符），超出部分截断
message-max-length: 256

# 频道触发符号：消息以指定符号开头时，强制发送到对应频道，并把符号从内容中移除。
# 例如下面的配置下，输入 "#你好" 会把 "你好" 发送到全局（跨服）频道。
# 可配置多个；长符号优先匹配（"##" 会先于 "#"）。
# 玩家需要拥有目标频道的使用权限，否则会提示无权限且消息不会发出。
triggers:
  "#": global

# 跨服频道在跨服通道不可用时（未运行在 Velocity 代理下，或代理端插件未部署）的处理：
#   LOCAL = 降级为本服广播（消息仍会发出，但不跨服）
#   DROP  = 拦截并提示发送者
network-unavailable-action: LOCAL
