name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify version consistency
        run: |
          GRADLE_VER=$(grep -oP '(?<=^version = ")[^"]+' build.gradle.kts)
          YML_VER=$(grep -oP "(?<=^version: ')[^']+" src/main/resources/paper-plugin.yml)
          VEL_VER=$(grep -oP '(?<=version = ")[^"]+' velocity/src/main/java/com/junxiex/mikuchat/velocity/MikuChatVelocity.java)
          echo "build.gradle.kts=$GRADLE_VER  paper-plugin.yml=$YML_VER  @Plugin=$VEL_VER"
          if [ "$GRADLE_VER" != "$YML_VER" ] || [ "$GRADLE_VER" != "$VEL_VER" ]; then
            echo "::error::版本号不一致，请同步 build.gradle.kts / paper-plugin.yml / MikuChatVelocity.java"
            exit 1
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: MikuChat-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            build/libs/MikuChat-*.jar
            velocity/build/libs/MikuChat-Velocity-*.jar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/MikuChat-*.jar
            velocity/build/libs/MikuChat-Velocity-*.jar