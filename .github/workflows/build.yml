name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整 tag 对象才能读到附注 tag 的正文（用于生成 Release 更新日志）
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify version consistency
        run: |
          GRADLE_VER=$(grep -oP '(?<=^version = ")[^"]+' build.gradle.kts)
          YML_VER=$(grep -oP "(?<=^version: ')[^']+" src/main/resources/paper-plugin.yml)
          VEL_VER=$(grep -oP '(?<=version = ")[^"]+' velocity/src/main/java/com/junxiex/mikuchat/velocity/MikuChatVelocity.java)
          echo "build.gradle.kts=$GRADLE_VER  paper-plugin.yml=$YML_VER  @Plugin=$VEL_VER"
          if [ "$GRADLE_VER" != "$YML_VER" ] || [ "$GRADLE_VER" != "$VEL_VER" ]; then
            echo "::error::版本号不一致，请同步 build.gradle.kts / paper-plugin.yml / MikuChatVelocity.java"
            exit 1
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Compute artifact name
        id: artifact
        run: |
          # PR 构建时 github.ref_name 形如 "1/merge"，含斜杠会导致 artifact 名称非法
          SAFE_NAME=$(echo '${{ github.ref_name }}' | tr '/' '-')
          echo "name=MikuChat-${SAFE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          if-no-files-found: error
          path: |
            build/libs/MikuChat-*.jar
            velocity/build/libs/MikuChat-Velocity-*.jar

      - name: Extract release notes from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # 正式版更新日志取自附注 tag 的正文，保证与打 tag 时写入的说明完全一致
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 未附带更新日志正文，请使用 git tag -a 并填写说明"
            exit 1
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 正式版以附注 tag 的正文作为结构化更新日志，不再使用自动生成的一段式说明
          body_path: release-notes.md
          files: |
            build/libs/MikuChat-*.jar
            velocity/build/libs/MikuChat-Velocity-*.jar